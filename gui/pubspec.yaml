name: davdeck
description: "DavDeck native desktop management client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/davdeck_logo.png
    - assets/branding/davdeck_tray.png
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png
    - windows/runner/resources/app_icon.ico
